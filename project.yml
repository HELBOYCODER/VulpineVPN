name: Vulpine
options:
  bundleIdPrefix: ua.entaytion
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 1.2.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  Vulpine:
    type: application
    platform: iOS
    bundleIdPrefix: ua.entaytion.vulpine
    deploymentTarget: "16.0"
    sources:
      - path: Vulpine
        excludes:
          - "TunnelExtensionTests"
    info:
      path: Vulpine/Info.plist
      properties:
        CFBundleDisplayName: Vulpine VPN
        CFBundleShortVersionString: "1.2.0"
        CFBundleVersion: "3"
        MinimumOSVersion: "16.0"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: Vulpine/Vulpine.entitlements
    dependencies:
      - target: VulpineTunnel
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.entaytion.vulpine
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  VulpineTunnel:
    type: app-extension
    platform: iOS
    bundleIdPrefix: ua.entaytion.vulpine.tunnel
    deploymentTarget: "16.0"
    sources:
      - path: VulpineTunnel
      - path: Vulpine/TunnelExtension
      - path: Vulpine/Shared
    info:
      path: VulpineTunnel/Info.plist
      properties:
        CFBundleDisplayName: VulpineTunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).TunnelPacketFlowProvider"
    entitlements:
      path: VulpineTunnel/VulpineTunnel.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.entaytion.vulpine.tunnel
        PRODUCT_NAME: VulpineTunnel
schemes:
  Vulpine:
    build:
      targets:
        Vulpine: all
        VulpineTunnel: all
    archive:
      config: Release
